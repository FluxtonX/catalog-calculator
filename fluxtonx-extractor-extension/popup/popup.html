<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Catalog Calculator Extractor</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-circle">
        <img src="../assets/icon-48.png" width="32" height="32" style="border-radius: 50%;" />
      </div>
      <h2>Catalog Calculator</h2>
      <p>Instant Valuation Data</p>
    </div>
    
    <div id="status" class="status-box">
      Ready to analyze current page.
    </div>

    <div id="results" class="results-container hidden">
       <div class="result-item">
          <span class="label">Artist Name</span>
          <span class="value" id="res-artist" title="">--</span>
       </div>
       <div class="result-item highlight">
          <span class="label">Total Revenue</span>
          <span class="value" id="res-revenue">--</span>
       </div>
       <div class="result-item">
          <span class="label">Total Streams</span>
          <span class="value" id="res-streams">--</span>
       </div>
       <div class="result-item">
          <span class="label">Total Tracks</span>
          <span class="value" id="res-tracks">--</span>
       </div>
       
       <div style="display:flex; gap:10px;">
           <button id="copyBtn" class="btn secondary-btn" style="flex:1; padding: 6px;">Copy Data</button>
           <button id="downloadCsvBtn" class="btn secondary-btn" style="flex:1; padding: 6px;">Download CSV</button>
       </div>
       <button id="sendToAppBtn" class="btn primary-btn" style="width: 100%; margin-top: 10px; background-color: var(--success); border-color: var(--success);">
         Send to Catalog Calculator
       </button>
    </div>

    <button id="extractBtn" class="btn primary-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
      Extract Data
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
